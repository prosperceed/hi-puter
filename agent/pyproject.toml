[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hi-puter"
version = "0.1.0"
description = "Offline-first local voice assistant for Windows and Linux"
requires-python = ">=3.10"
dependencies = ["typer>=0.12,<1", "platformdirs>=4,<5", "psutil>=5.9,<8", "tomli>=2,<3; python_version < '3.11'", "tomli-w>=1,<3"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4,<1"]
speech = ["vosk>=0.3,<1", "webrtcvad-wheels>=2.0,<3", "faster-whisper>=1,<2", "pyttsx3>=2.90,<3"]
windows = ["pycaw>=20230407; sys_platform == 'win32'", "comtypes>=1.2; sys_platform == 'win32'", "pywin32>=306; sys_platform == 'win32'", "mss>=9; sys_platform == 'win32'"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "pip-audit>=2.7,<3"]

[project.scripts]
hi-puter = "hi_puter.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hi_puter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: requires real audio hardware or installed models"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP", "SIM", "S", "PL", "RUF"]
lint.ignore = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src"]
