[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hi-puter"
dynamic = ["version"]  # from src/hi_puter/__init__.py
description = "Offline-first local voice assistant for Windows and Linux"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Prosper Success" }]
keywords = ["voice assistant", "speech", "local llm", "ollama", "whisper", "desktop automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = ["typer>=0.12,<1", "platformdirs>=4,<5", "psutil>=5.9,<8", "tomli>=2,<3; python_version < '3.11'", "tomli-w>=1,<3", "jeepney>=0.8,<1; sys_platform == 'linux'"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4,<1", "numpy>=1.24"]
speech = ["vosk>=0.3,<1", "webrtcvad-wheels>=2.0,<3", "faster-whisper>=1,<2", "pyttsx3>=2.90,<3"]
windows = ["pycaw>=20230407; sys_platform == 'win32'", "comtypes>=1.2; sys_platform == 'win32'", "pywin32>=306; sys_platform == 'win32'", "mss>=9; sys_platform == 'win32'"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "pip-audit>=2.7,<3", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://hi-puter.vercel.app"
Repository = "https://github.com/prosperceed/hi-puter"
Issues = "https://github.com/prosperceed/hi-puter/issues"

[project.scripts]
hi-puter = "hi_puter.cli.app:app"

[tool.hatch.version]
path = "src/hi_puter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hi_puter"]

[tool.hatch.build.targets.sdist]
include = ["src/hi_puter", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: requires real audio hardware or installed models"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "B", "UP", "SIM", "S", "PL", "RUF"]
# PLC0415: optional audio/speech packages are imported lazily on purpose.
# PLR0913: settings are passed as keyword-only arguments.
lint.ignore = ["S603", "S607", "PLC0415", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"src/hi_puter/core/config.py" = ["PLR2004"]  # validation bounds read best inline

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Optional runtime dependencies without type information.
module = ["faster_whisper", "numpy", "pyttsx3", "sounddevice", "webrtcvad", "psutil", "vosk", "jeepney", "jeepney.*"]
ignore_missing_imports = true
